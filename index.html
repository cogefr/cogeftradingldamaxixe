<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COGEF Master Web — Select Shop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%231d6fb8'/%3E%3Ccircle cx='26' cy='30' r='7' fill='%233d9e4a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --text: #122026;
        --text-muted: #5b6d75;
        --navy: #0a365c;
        --primary: #0a365c;
        --accent: #8a9aa8;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --site: #0f766e;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { height: 100%; }

      body {
        min-height: 100vh;
        font-family: Outfit, "Segoe UI", sans-serif;
        color: var(--text);
        background: #e8f3fb;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .space {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0%, rgba(236, 247, 255, 0.22) 40%, rgba(255, 255, 255, 0.42) 100%),
          url("bg-city.jpg") center / cover no-repeat,
          url("https://static.vecteezy.com/system/resources/thumbnails/035/661/314/small/ai-generated-glass-skyscraper-reflecting-the-blue-sky-and-surrounding-buildings-free-photo.jpg") center / cover no-repeat,
          #e8f3fb;
      }

      #globe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        opacity: 1;
      }

      .earth-css {
        position: absolute;
        left: 50%;
        top: 42%;
        z-index: 2;
        width: min(72vmin, 680px);
        height: min(72vmin, 680px);
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .earth-css.ready { opacity: 1; }

      .earth-sphere {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        box-shadow:
          inset -30px -14px 54px rgba(8, 50, 90, 0.45),
          inset 16px 10px 28px rgba(255, 255, 255, 0.28),
          0 24px 70px rgba(14, 116, 144, 0.22);
      }

      .earth-map {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-repeat: repeat-x;
        background-size: 200% 100%;
        background-position: 12% center;
        animation: spin-earth 48s linear infinite;
      }

      .earth-shine {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.38), transparent 34%),
          radial-gradient(circle at 78% 72%, rgba(8, 40, 80, 0.28), transparent 42%);
        pointer-events: none;
      }

      .earth-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        box-shadow: 0 0 0 10px rgba(125, 211, 252, 0.18), 0 0 48px rgba(56, 189, 248, 0.28);
        pointer-events: none;
      }

      @keyframes spin-earth {
        from { background-position: 12% center; }
        to { background-position: 212% center; }
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(255, 255, 255, 0.08) 82%, rgba(255, 255, 255, 0.22) 100%);
        pointer-events: none;
      }

      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px 18px 18px;
        max-width: 1440px;
        margin: 0 auto;
      }

      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.58));
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 20px;
        padding: 12px 18px;
        box-shadow: 0 10px 36px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        height: 46px;
        width: auto;
        max-width: 220px;
        object-fit: contain;
        display: block;
        background: #fff;
        border-radius: 10px;
        padding: 4px 8px;
      }

      .brand h1 {
        font-family: Montserrat, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: var(--navy);
      }

      .brand h1 span { color: var(--navy); }

      .brand p {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      .clock { text-align: right; }

      .clock .time {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.03em;
        color: var(--primary);
      }

      .clock .date {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18px 8px 10px;
        min-height: 0;
      }

      .stage-kicker {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .crest-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100%;
        max-width: 760px;
      }

      .nav-arrow {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 1px solid rgba(15, 118, 110, 0.18);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.62));
        color: var(--primary);
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.10), inset 0 1px 0 #fff;
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), background 0.18s var(--ease);
      }

      .nav-arrow svg { width: 28px; height: 28px; display: block; }

      .nav-arrow:hover {
        transform: scale(1.08);
        box-shadow: 0 14px 32px rgba(15, 118, 110, 0.18), inset 0 1px 0 #fff;
        background: #fff;
      }

      .nav-arrow:active { transform: scale(0.96); }

      .shop-seal {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        padding: 9px;
        display: grid;
        place-items: center;
        isolation: isolate;
        overflow: visible;
      }

      .shop-seal::before,
      .shop-seal::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
      }

      .seal-core {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12% 10% 10%;
        gap: 6px;
        box-shadow: inset 0 1px 0 #fff;
      }

      .seal-core img {
        width: 78%;
        max-height: 46%;
        object-fit: contain;
        flex-shrink: 0;
      }

      .seal-core strong {
        font-family: Montserrat, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: clamp(11px, 2.4vw, 22px);
        color: var(--navy);
        text-align: center;
        line-height: 1.12;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        max-width: 92%;
        overflow-wrap: break-word;
      }

      .portrait .shop-seal { padding: 6px; }
      .portrait .seal-core { padding: 8% 7% 7%; gap: 2px; }
      .portrait .seal-core img { width: 82%; max-height: 42%; }
      .portrait .seal-core strong { font-size: 9px; letter-spacing: 0; line-height: 1.1; }

      .seal-shop-1 { background: conic-gradient(from 90deg, #0a365c, #1e5a8a, #0a365c); box-shadow: 0 0 0 3px #c4a35a, 0 8px 20px rgba(10,54,92,.2); }
      .seal-shop-1 .seal-core strong { color: #0a365c; }

      .seal-shop-2 { background: conic-gradient(#06b6d4, #0e7490, #67e8f9, #06b6d4); box-shadow: 0 8px 22px rgba(6,182,212,.28); }
      .seal-shop-2::after { inset: 5px; border: 2px dashed rgba(255,255,255,.75); }
      .seal-shop-2 .seal-core strong { color: #0e7490; }

      .seal-shop-4 { background: linear-gradient(145deg, #059669, #34d399 45%, #a7f3d0); box-shadow: 0 0 0 4px #065f46, 0 8px 20px rgba(5,150,105,.25); }
      .seal-shop-4 .seal-core strong { color: #047857; }

      .seal-shop-6 { background: repeating-conic-gradient(#16a34a 0 12deg, #14532d 0 18deg); box-shadow: 0 8px 20px rgba(22,163,74,.28); }
      .seal-shop-6::after { inset: 6px; background: #fff; }
      .seal-shop-6 .seal-core { background: #fff; }
      .seal-shop-6 .seal-core strong { color: #166534; }

      .seal-shop-7 { background: radial-gradient(circle at 30% 25%, #5eead4, #0f766e 62%, #134e4a); box-shadow: 0 8px 20px rgba(15,118,110,.28); }
      .seal-shop-7::before { inset: -7px; border: 2px dotted #14b8a6; animation: orbit 12s linear infinite; }
      .seal-shop-7 .seal-core strong { color: #0f766e; }

      .seal-cumbana { background: conic-gradient(#7c3aed, #c4b5fd, #a78bfa, #6d28d9, #7c3aed); box-shadow: 0 8px 24px rgba(124,58,237,.28); }
      .seal-cumbana .seal-core strong { color: #6d28d9; }

      .seal-inhambane { background: conic-gradient(from 40deg, #c4a35a, #0f766e, #c4a35a, #134e4a, #c4a35a); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #c4a35a, 0 10px 24px rgba(196,163,90,.35); }
      .seal-inhambane .seal-core strong { color: #0f766e; }

      .seal-inharrime { background: linear-gradient(#0369a1, #38bdf8); box-shadow: 0 8px 22px rgba(3,105,161,.28); }
      .seal-inharrime::after { inset: 4px; border: 3px double #e0f2fe; }
      .seal-inharrime .seal-core strong { color: #0369a1; }

      .seal-massinga { background: conic-gradient(from 0deg, #f59e0b, #fde68a, #b45309, #fbbf24, #f59e0b); box-shadow: 0 8px 24px rgba(245,158,11,.32); }
      .seal-massinga::before { background: repeating-conic-gradient(rgba(255,255,255,.0) 0 8deg, rgba(255,255,255,.35) 0 10deg); }
      .seal-massinga .seal-core strong { color: #b45309; }

      .seal-zavala { background: linear-gradient(180deg, #22d3ee, #0284c7 55%, #0369a1); box-shadow: 0 8px 22px rgba(2,132,199,.28); }
      .seal-zavala::after { inset: 7px 4px 4px 7px; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; transform: rotate(-12deg); }
      .seal-zavala .seal-core strong { color: #0369a1; }

      .seal-morrumbene-1 { background: conic-gradient(#0f766e, #5eead4, #115e59, #2dd4bf, #0f766e); box-shadow: 0 0 0 3px #99f6e4, 0 8px 20px rgba(15,118,110,.25); }
      .seal-morrumbene-1 .seal-core strong { color: #115e59; }

      .seal-morrumbene-2 { background: #0f766e; box-shadow: 0 8px 20px rgba(13,148,136,.28); }
      .seal-morrumbene-2::after { inset: 5px; border: 3px dashed #5eead4; }
      .seal-morrumbene-2 .seal-core strong { color: #0f766e; }

      .seal-inhambane-sm { background: linear-gradient(145deg, #92400e, #e4c27a 40%, #78350f); box-shadow: 0 0 0 4px #fde68a, 0 8px 22px rgba(146,64,14,.28); }
      .seal-inhambane-sm .seal-core strong { color: #92400e; }

      .seal-movel { background: conic-gradient(from 200deg, #4c1d95, #a78bfa, #7c3aed, #2e1065, #a78bfa); box-shadow: 0 8px 24px rgba(76,29,149,.32); }
      .seal-movel::after { inset: 6px; border: 2px solid rgba(255,255,255,.55); }
      .seal-movel .seal-core strong { color: #5b21b6; }

      .seal-warehouse { background: linear-gradient(160deg, #0e7490, #67e8f9, #155e75); box-shadow: 0 8px 22px rgba(14,116,144,.28); }
      .seal-warehouse::before { inset: -4px; border: 3px solid #334155; border-radius: 12%; }
      .seal-warehouse .seal-core strong { color: #155e75; }

      .seal-inhanssoro { background: linear-gradient(145deg, #854d0e, #d4b06a, #a16207); box-shadow: 0 8px 22px rgba(133,77,14,.28); }
      .seal-inhanssoro::after { inset: 5px; border: 2px solid #fef3c7; }
      .seal-inhanssoro .seal-core strong { color: #854d0e; }

      .seal-tally { background: repeating-conic-gradient(#ca8a04 0 10deg, #fde68a 0 16deg); box-shadow: 0 0 0 3px #92400e, 0 8px 20px rgba(202,138,4,.28); }
      .seal-tally .seal-core strong { color: #854d0e; }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      .crest-wrap {
        position: relative;
        width: min(300px, 52vw);
        height: min(300px, 52vw);
        margin: 4px 0 8px;
      }

      .crest-glow {
        position: absolute;
        inset: -12%;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--site) 34%, transparent), transparent 68%);
        filter: blur(12px);
        animation: pulse-glow 2.8s ease-in-out infinite;
        pointer-events: none;
      }

      .crest {
        position: relative;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 16px 26px rgba(10, 54, 92, 0.18));
        animation: crest-in 0.45s var(--ease);
      }

      .feature-name {
        font-family: Montserrat, "Segoe UI", sans-serif;
        font-size: clamp(26px, 4.8vw, 56px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.08;
        text-transform: uppercase;
        color: #ffffff;
        animation: name-in 0.4s var(--ease);
        max-width: 92vw;
        text-shadow:
          0 1px 0 rgba(10, 54, 92, 0.35),
          0 8px 22px rgba(10, 54, 92, 0.45),
          0 0 18px rgba(0, 0, 0, 0.28);
      }

      .feature-meta {
        margin-top: 8px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .enter-btn {
        margin-top: 16px;
        min-width: 220px;
        height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(180deg, #164a78, #0a365c);
        box-shadow: 0 10px 28px rgba(10, 54, 92, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.18s var(--ease), filter 0.18s var(--ease);
      }

      .enter-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

      .enter-btn.locked {
        color: var(--text-muted);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.55));
        border-color: rgba(15, 118, 110, 0.14);
        box-shadow: inset 0 1px 0 #fff;
        pointer-events: none;
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .roster-bar {
        position: relative;
        padding: 14px 12px 12px;
        border-radius: 24px;
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.46));
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.10), inset 0 1px 0 #fff;
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
      }

      .roster-label {
        text-align: center;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--navy);
        margin-bottom: 10px;
      }

      .roster {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .portrait {
        appearance: none;
        border: 0;
        background: transparent;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        padding: 0;
        cursor: pointer;
        color: inherit;
        transition: transform 0.2s var(--ease), filter 0.2s var(--ease);
      }

      .portrait .shop-seal { pointer-events: none; }

      .portrait:hover,
      .portrait.selected {
        transform: translateY(-10px) scale(1.08);
        z-index: 2;
        filter: drop-shadow(0 12px 18px rgba(10, 54, 92, 0.22));
      }

      .portrait.selected .shop-seal {
        transform: scale(1.02);
        filter: brightness(1.05);
      }

      @keyframes crest-in {
        from { transform: scale(0.86) rotate(-6deg); opacity: 0; }
        to { transform: scale(1) rotate(0); opacity: 1; }
      }

      @keyframes name-in {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      @media (max-width: 760px) {
        .portrait { width: 76px; height: 76px; }
        .portrait .seal-core strong { font-size: 7px; }
        .crest-wrap { width: min(220px, 54vw); height: min(220px, 54vw); }
        .nav-arrow { width: 48px; height: 48px; }
        .nav-arrow svg { width: 22px; height: 22px; }
        .crest-row { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="space" aria-hidden="true">
      <canvas id="globe"></canvas>
      <div class="earth-css" id="earth-css">
        <div class="earth-ring"></div>
        <div class="earth-sphere">
          <div class="earth-map" id="earth-map"></div>
          <div class="earth-shine"></div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>

    <div class="shell">
      <header class="top">
        <div class="brand">
          <img class="brand-logo" src="cogef-logo.png" alt="COGEF Trading Lda" />
          <div>
            <h1>Master Web</h1>
            <p>Select your shop</p>
          </div>
        </div>
        <div class="clock">
          <div class="time" id="clock-time">--:--</div>
          <div class="date" id="clock-date"></div>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="stage-kicker">Player Select</div>
        <div class="crest-row">
          <button type="button" class="nav-arrow" id="prev-shop" aria-label="Previous shop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
          </button>
          <div class="crest-wrap">
            <div class="crest-glow" id="crest-glow"></div>
            <div class="crest" id="crest"></div>
          </div>
          <button type="button" class="nav-arrow" id="next-shop" aria-label="Next shop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <h2 class="feature-name" id="feature-name">Shop</h2>
        <p class="feature-meta" id="feature-meta"></p>
        <a class="enter-btn locked" id="enter-btn" href="#">Awaiting link</a>
        <p class="hint">Use the arrows or hover a crest to select</p>
      </section>

      <div class="roster-bar">
        <div class="roster-label">Choose a location</div>
        <div class="roster" id="roster"></div>
      </div>
    </div>

    <script>
      /* ============================================================
         PASTE EACH SHOP / STORE / WAREHOUSE URL IN THE `url` FIELD.
         ============================================================ */
      const SITES = [
        { id: "shop-1", code: "SH01", name: "Shop 1", short: "Shop 1", location: "Mini supermarket", category: "shop", color: "#2dd4bf", accent: "#c4a35a", mark: "01", motif: "store", url: "https://shop1minisupermarket.maxixecogef100.workers.dev/" },
        { id: "shop-2", code: "SH02", name: "Shop 2", short: "Shop 2", location: "Maxixe", category: "shop", color: "#22d3ee", accent: "#67e8f9", mark: "02", motif: "store", url: "https://shop2maxixe.web.app/" },

        { id: "inhanssoro", code: "ARN", name: "Armazém Inhanssoro", short: "Inhanssoro", location: "Inhanssoro warehouse", category: "warehouse", color: "#d4b06a", accent: "#fde68a", mark: "AR", motif: "warehouse", url: "" },
        { id: "tally", code: "TP", name: "Tally Prime", short: "Tally", location: "Accounts & books", category: "other", color: "#fbbf24", accent: "#fef3c7", mark: "TP", motif: "ledger", url: "" }
      ];

      const ORG_LOGO = "cogef-logo.png";
      const ORG_LOGO_FALLBACK = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5h_Fb3kBI1CecuL3HiVFodHmYG4fEJfNMoK2XslwEfQ&s=10";

      const roster = document.getElementById("roster");
      const crest = document.getElementById("crest");
      const crestGlow = document.getElementById("crest-glow");
      const featureName = document.getElementById("feature-name");
      const featureMeta = document.getElementById("feature-meta");
      const enterBtn = document.getElementById("enter-btn");
      let selected = 0;

      function isLive(site) {
        return Boolean(site.url && site.url.trim());
      }

      function shopSeal(site, large) {
        const label = large ? site.name : site.short;
        return `
          <div class="shop-seal seal-${site.id}">
            <div class="seal-core">
              <img src="${ORG_LOGO}" alt="COGEF Trading Lda" onerror="this.onerror=null;this.src='${ORG_LOGO_FALLBACK}'" />
              <strong>${label}</strong>
            </div>
          </div>`;
      }

      function renderRoster() {
        roster.innerHTML = SITES.map((site, i) => `
          <button type="button" class="portrait${i === selected ? " selected" : ""}" data-index="${i}" aria-label="${site.name}">
            ${shopSeal(site, false)}
          </button>
        `).join("");
      }

      function showSelected() {
        const site = SITES[selected];
        document.documentElement.style.setProperty("--site", site.color);
        crestGlow.style.setProperty("--site", site.color);
        crest.innerHTML = shopSeal(site, true);
        crest.style.animation = "none";
        void crest.offsetWidth;
        crest.style.animation = "crest-in 0.45s cubic-bezier(0.22, 1, 0.36, 1)";
        featureName.textContent = site.name;
        featureName.style.animation = "none";
        void featureName.offsetWidth;
        featureName.style.animation = "name-in 0.4s cubic-bezier(0.22, 1, 0.36, 1)";
        featureMeta.textContent = site.location + "  ·  " + site.code;
        const live = isLive(site);
        enterBtn.className = live ? "enter-btn" : "enter-btn locked";
        enterBtn.textContent = live ? "Enter shop" : "Awaiting link";
        enterBtn.href = live ? site.url : "#";
        if (live) {
          enterBtn.target = "_blank";
          enterBtn.rel = "noopener noreferrer";
        } else {
          enterBtn.removeAttribute("target");
        }
        [...roster.children].forEach((el, i) => el.classList.toggle("selected", i === selected));
      }

      function selectAt(index) {
        selected = (index + SITES.length) % SITES.length;
        showSelected();
      }

      function enterSelected() {
        const site = SITES[selected];
        if (!isLive(site)) return;
        window.open(site.url, "_blank", "noopener,noreferrer");
      }

      document.getElementById("prev-shop").addEventListener("click", () => selectAt(selected - 1));
      document.getElementById("next-shop").addEventListener("click", () => selectAt(selected + 1));

      roster.addEventListener("pointerover", (e) => {
        const btn = e.target.closest(".portrait");
        if (!btn) return;
        selectAt(Number(btn.dataset.index));
      });

      roster.addEventListener("click", (e) => {
        const btn = e.target.closest(".portrait");
        if (!btn) return;
        selectAt(Number(btn.dataset.index));
        enterSelected();
      });

      enterBtn.addEventListener("click", (e) => {
        if (!isLive(SITES[selected])) e.preventDefault();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          e.preventDefault();
          selectAt(selected + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          selectAt(selected - 1);
        } else if (e.key === "Enter") {
          enterSelected();
        }
      });

      function tickClock() {
        const now = new Date();
        document.getElementById("clock-time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("clock-date").textContent = now.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
      }

      renderRoster();
      showSelected();
      tickClock();
      setInterval(tickClock, 1000);

      (function initEarthTexture() {
        const urls = [
          "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg",
          "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",
          "https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57752/land_shallow_topo_2048.jpg"
        ];
        const map = document.getElementById("earth-map");
        const wrap = document.getElementById("earth-css");
        let i = 0;
        function tryNext() {
          if (i >= urls.length) return;
          const url = urls[i++];
          const img = new Image();
          img.onload = function () {
            map.style.backgroundImage = 'url("' + url + '")';
            wrap.classList.add("ready");
          };
          img.onerror = tryNext;
          img.src = url;
        }
        tryNext();
      })();

      (function initGlobe() {
        const canvas = document.getElementById("globe");
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const land = [];
        const clouds = [];
        const tilt = 0.38;
        let rotation = 0.9;
        let w = 0;
        let h = 0;
        let radius = 0;
        let cx = 0;
        let cy = 0;
        let hideDots = false;

        document.getElementById("earth-css").addEventListener("transitionend", () => {
          if (document.getElementById("earth-css").classList.contains("ready")) hideDots = true;
        });

        function resize() {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          radius = Math.min(w, h) * 0.4;
          cx = w * 0.5;
          cy = h * 0.42;
        }

        function landColor(lat, lng) {
          const latD = lat * 180 / Math.PI;
          const lngD = lng * 180 / Math.PI;
          if (latD > 72 || latD < -58) return "#f4f7fb";
          if (latD > 16 && latD < 32 && lngD > -17 && lngD < 38) return "#d2b48c";
          if (latD > 12 && latD < 36 && lngD > 36 && lngD < 62) return "#c4a574";
          if (latD > -28 && latD < -16 && lngD > 118 && lngD < 142) return "#c6b07a";
          if (latD > -12 && latD < 8 && lngD > -74 && lngD < -48) return "#1f7a3a";
          if (latD > -34 && latD < 8 && lngD > 10 && lngD < 42) return "#2f9e4a";
          return Math.random() > 0.35 ? "#3d9e4a" : "#2b7a38";
        }

        function seedLand() {
          land.length = 0;
          const continents = [
            { lat: [36, 71], lng: [-10, 40], n: 520 },
            { lat: [-34, 37], lng: [-17, 51], n: 760 },
            { lat: [8, 75], lng: [40, 145], n: 1280 },
            { lat: [-10, 12], lng: [95, 140], n: 200 },
            { lat: [15, 72], lng: [-168, -52], n: 900 },
            { lat: [7, 23], lng: [-92, -77], n: 90 },
            { lat: [-55, 12], lng: [-81, -35], n: 520 },
            { lat: [-43, -11], lng: [113, 154], n: 220 },
            { lat: [-47, -34], lng: [166, 179], n: 36 },
            { lat: [60, 83], lng: [-73, -20], n: 120 },
            { lat: [-80, -62], lng: [-180, 180], n: 180 }
          ];
          continents.forEach((c) => {
            for (let i = 0; i < c.n; i++) {
              const lat = (c.lat[0] + Math.random() * (c.lat[1] - c.lat[0])) * Math.PI / 180;
              const lng = (c.lng[0] + Math.random() * (c.lng[1] - c.lng[0])) * Math.PI / 180;
              land.push({ lat, lng, color: landColor(lat, lng) });
            }
          });
          clouds.length = 0;
          for (let i = 0; i < 220; i++) {
            clouds.push({
              lat: (Math.random() * 140 - 70) * Math.PI / 180,
              lng: (Math.random() * 360 - 180) * Math.PI / 180
            });
          }
        }

        function project(lat, lng, rot) {
          const x0 = Math.cos(lat) * Math.sin(lng + rot);
          const z0 = Math.cos(lat) * Math.cos(lng + rot);
          const y0 = Math.sin(lat);
          const y1 = y0 * Math.cos(tilt) - z0 * Math.sin(tilt);
          const z1 = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);
          return { x: cx + x0 * radius, y: cy - y1 * radius, z: z1 };
        }

        function drawGlobe() {
          ctx.clearRect(0, 0, w, h);
          if (hideDots) return;

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, radius * 1.16, 0, Math.PI * 2);
          const halo = ctx.createRadialGradient(cx, cy, radius * 0.82, cx, cy, radius * 1.16);
          halo.addColorStop(0, "rgba(56, 189, 248, 0)");
          halo.addColorStop(0.7, "rgba(56, 189, 248, 0.18)");
          halo.addColorStop(1, "rgba(56, 189, 248, 0)");
          ctx.fillStyle = halo;
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.clip();

          const ocean = ctx.createRadialGradient(cx - radius * 0.28, cy - radius * 0.3, radius * 0.08, cx, cy, radius);
          ocean.addColorStop(0, "#6ec8f2");
          ocean.addColorStop(0.35, "#1d8ad4");
          ocean.addColorStop(0.7, "#1570b8");
          ocean.addColorStop(1, "#0b4f8a");
          ctx.fillStyle = ocean;
          ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

          for (let i = 0; i < land.length; i++) {
            const p = project(land[i].lat, land[i].lng, rotation);
            if (p.z <= 0) continue;
            const depth = Math.max(0.2, p.z);
            ctx.globalAlpha = 0.55 + depth * 0.45;
            ctx.fillStyle = land[i].color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.4 + depth * 1.15, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          for (let i = 0; i < clouds.length; i++) {
            const p = project(clouds[i].lat, clouds[i].lng, rotation * 1.08);
            if (p.z <= 0.2) continue;
            ctx.fillStyle = "rgba(255,255,255," + (0.08 + p.z * 0.16) + ")";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3.2 + p.z * 2.2, 0, Math.PI * 2);
            ctx.fill();
          }

          const shade = ctx.createRadialGradient(cx + radius * 0.32, cy + radius * 0.12, radius * 0.15, cx, cy, radius);
          shade.addColorStop(0, "rgba(8, 40, 80, 0)");
          shade.addColorStop(0.55, "rgba(8, 40, 80, 0.12)");
          shade.addColorStop(1, "rgba(8, 30, 60, 0.5)");
          ctx.fillStyle = shade;
          ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

          const shine = ctx.createRadialGradient(cx - radius * 0.38, cy - radius * 0.42, 6, cx - radius * 0.1, cy - radius * 0.18, radius * 0.72);
          shine.addColorStop(0, "rgba(255,255,255,0.38)");
          shine.addColorStop(0.35, "rgba(186, 230, 253, 0.12)");
          shine.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = shine;
          ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
          ctx.restore();

          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(14, 116, 144, 0.28)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        let last = performance.now();
        function frame(now) {
          const dt = Math.min(40, now - last);
          last = now;
          rotation += dt * 0.00016;
          drawGlobe();
          requestAnimationFrame(frame);
        }

        seedLand();
        resize();
        window.addEventListener("resize", resize);
        requestAnimationFrame(frame);
      })();
    </script>
